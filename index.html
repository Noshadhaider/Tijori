async function sealB(key,u){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u)),r=new Uint8Array(12+ct.length);r.set(iv);r.set(ct,12);return b64(r)}
async function unsealB(key,s){const u=unb(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}
const seal=(k,o)=>sealB(k,enc.encode(JSON.stringify(o))),unseal=async(k,s)=>JSON.parse(dec.decode(await unsealB(k,s)));
const hid=async c=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('s'+c)))].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('');

// ---- raw-byte AES-GCM (no base64) used for the R2 upload/download path, so a 10GB file
// never has its size inflated by ~33% and isn't round-tripped through a text string ----
async function sealRaw(key,u){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u)),r=new Uint8Array(12+ct.length);r.set(iv);r.set(ct,12);return r}
async function unsealRaw(key,u){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}

// ===== Files: encrypted in the browser, stored as ~900 KB chunks in Firestore (users/<uid>/blobs) - works on the free Spark plan =====
const BL=(bid,i)=>col('blobs').doc(bid+'_'+i);
async function putBytes(file,meta,cb){
 const bid=rid(),n=Math.ceil(file.size/CH)||1;let done=0;
 try{
  for(let i=0;i<n;i++){
   const chunk=new Uint8Array(await file.slice(i*CH,Math.min(file.size,(i+1)*CH)).arrayBuffer());
   const sealed=await sealRaw(KEY,chunk);
   await BL(bid,i).set({d:firebase.firestore.Blob.fromUint8Array(sealed)});done=i+1;
   cb&&cb(done/n);
  }
 }catch(e){await deleteBlob(bid,done+1).catch(()=>{});throw e}
 await col('items').add({c:await seal(KEY,{...meta,bid,n,size:file.size}),ts:Date.now()});
}
async function getBytes(x){
 // Note: this buffers the whole decrypted file in memory before returning it.
 const out=new Uint8Array(x.size);let o=0;
 for(let i=0;i<x.n;i++){
  const d=await BL(x.bid,i).get();if(!d.exists)throw new Error('File data missing');
  out.set(await unsealRaw(KEY,d.data().d.toUint8Array()),o);o+=Math.min(CH,x.size-i*CH);
 }
 return out;
}
async function deleteBlob(bid,n){for(let i=0;i<n;i++)await BL(bid,i).delete()}

const race=p=>Promise.race([p,new Promise((_,j)=>setTimeout(j,5000))]);
async function thumb(f,vid){
 const u=URL.createObjectURL(f);let el,w,h;
 if(vid){el=document.createElement('video');el.muted=true;el.src=u;await race(new Promise((r,j)=>{el.onloadeddata=r;el.onerror=j}));el.currentTime=Math.min(1,(el.duration||2)/2);await race(new Promise(r=>el.onseeked=r));w=el.videoWidth;h=el.videoHeight}
 else{el=new Image;el.src=u;await race(el.decode());w=el.width;h=el.height}
 const s=Math.min(1,240/Math.max(w,h)),c=document.createElement('canvas');c.width=w*s;c.height=h*s;c.getContext('2d').drawImage(el,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.6);
}

async function runQ(){

 while(q=Q.find(x=>x.st=='wait')){q.st='up';paint();
  try{let th='';try{th=q.s=='img'?await thumb(q.f):q.s=='vid'?await thumb(q.f,1):''}catch{}
   await putBytes(q.f,{k:'file',sec:q.s,fold:q.fold,name:q.name,mime:q.f.type||'application/octet-stream',th},p=>{q.p=p;paint()});

function rowMenu(id){
 const x=items.find(a=>a.id==id);if(!x)return;
 M(`<h3 style="margin-top:0">${esc(x.k=='note'?x.title:x.name)}</h3><button onclick="${x.k=='note'?'viewNote':'viewFile'}('${id}')">Open</button><button class="g" onclick="m.close();pushShare([items.find(a=>a.id=='${id}')])">Share</button><button class="g d" onclick="del('${id}')">Delete</button><button class="g" onclick="m.close()">Close</button>`);
}
async function delSel(){
 const n=sel.size;if(!n||!confirm(`Delete ${n} item${n>1?'s':''} permanently?`))return;
 const L=[...sel];sel.clear();selMode=0;
 try{for(let j=0;j<L.length;j++){st(`Deleting ${j+1}/${L.length}…`);if(items.find(a=>a.id==L[j]))await delItem(L[j])}}catch(e){alert(e.message)}
 st('');render();
}
async function delItem(id){const x=items.find(a=>a.id==id);if(x.k=='file')await deleteBlob(x.bid,x.n);await col('items').doc(id).delete()}
async function delFolder(id){if(!confirm('This folder and all its files will be deleted. Sure?'))return;for(const x of items.filter(a=>a.fold==id))await delItem(x.id);await delItem(id);nav.f=null;render()}
async function del(id){if(confirm('Delete this permanently?')){await delItem(id);m.close()}}

async function viewFile(id){
 const x=items.find(a=>a.id==id);
 M(`<h3 style="margin-top:0">${esc(x.name)}</h3><p class="mu" id="ld">Opening…</p><div id="pv"></div><div class="row"><button class="g" onclick="pushShare([items.find(a=>a.id=='${id}')])">Share</button><button class="g d" onclick="del('${id}')">Delete</button></div><button class="g" onclick="m.close()">Close</button>`);
 try{const u=URL.createObjectURL(new Blob([await getBytes(x)],{type:x.mime}));$('#ld').remove();
  $('#pv').innerHTML=(x.mime.startsWith('image/')?`<img src="${u}" style="width:100%;border-radius:12px">`:x.mime.startsWith('video/')?`<video src="${u}" controls playsinline style="width:100%;border-radius:12px"></video>`:'')+`<a download="${esc(x.name)}" href="${u}"><button>⬇️ Download</button></a>`;
 }catch(e){$('#ld')&&($('#ld').textContent=e.message)}
}
function viewNote(id){
 const x=items.find(a=>a.id==id);
 M(`<h3 style="margin-top:0">📝 ${esc(x.title)}</h3><p style="white-space:pre-wrap;word-break:break-word">${esc(x.body)}</p><div class="row"><button class="g" onclick="noteForm('${id}')">Edit</button><button class="g" onclick="pushShare([items.find(a=>a.id=='${id}')])">Share</button><button class="g d" onclick="del('${id}')">Delete</button></div><button class="g" onclick="m.close()">Close</button>`);
}
function noteForm(id){
 const x=id?items.find(a=>a.id==id):{title:'',body:''};
 M(`<h3 style="margin-top:0">${id?'Edit note':'New note'}</h3><input id="nt" placeholder="Title" value="${esc(x.title)}"><textarea id="nb" rows="10" placeholder="Write here…">${esc(x.body)}</textarea><button onclick="saveNote('${id||''}')">Save</button><button class="g" onclick="m.close()">Cancel</button>`);
}
async function saveNote(id){
 try{const c=await seal(KEY,{k:'note',sec:'note',title:$('#nt').value.trim()||'Untitled',body:$('#nb').value});
  id?await col('items').doc(id).update({c}):await col('items').add({c,ts:Date.now()});m.close()}catch(e){alert(e.message)}
}

// ===== Code-based sharing (small files), end-to-end encrypted, via Firebase RTDB =====
function send(){
 const L=items.filter(i=>sel.has(i.id));if(!L.length)return alert('Select items first');
 if(L.reduce((a,x)=>a+(x.size||0),0)>SHAREMAX)return alert('You cannot send more than '+fs(SHAREMAX)+' in total');pushShare(L);
}
async function pushShare(L){
 try{
  const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1e8).padStart(8,'0'),id=await hid(code),k=await aes(code,'share'),metas=[];
  for(let j=0;j<L.length;j++){const {id:_,...x}=L[j];st(`Sending ${j+1}/${L.length}…`);
   if(x.k=='file'){const u=await getBytes(x);const sch=600*1024,sn=Math.ceil(u.length/sch)||1;for(let i=0;i<sn;i++)await rtdb.ref('sb/'+id+'/'+(x.bid||'f')+'_'+i).set(await sealB(k,u.subarray(i*sch,(i+1)*sch)));x.sn=sn;x.fold=''}
   metas.push(x)}
  await rtdb.ref('s/'+id).set({c:await seal(k,metas),exp:Date.now()+6e5});st('');
  M(`<h3 style="margin-top:0">Share code</h3><div class="code">${code}</div><p class="mu">Give this code to the other person. It works for 10 minutes and expires as soon as it is received once.</p><button onclick="m.close()">OK</button>`);
 }catch(e){st('');alert(e.message)}
}
async function recv(){
 const c=$('#rc').value.trim();if(!/^\d{8}$/.test(c))return alert('Enter the 8-digit code');
 try{
  const id=await hid(c),r=rtdb.ref('s/'+id),s=await r.get();
  if(!s.exists()||s.val().exp<Date.now())return alert('Code is wrong or has expired');
  const k=await aes(c,'share'),L=await unseal(k,s.val().c);
  for(let j=0;j<L.length;j++){const x=L[j];st(`Receive ${j+1}/${L.length}…`);
   if(x.k=='note'){await col('items').add({c:await seal(KEY,x),ts:Date.now()});continue}
   const u=new Uint8Array(x.size);let o=0;
   for(let i=0;i<x.sn;i++){const b=await unsealB(k,(await rtdb.ref('sb/'+id+'/'+(x.bid||'f')+'_'+i).get()).val());u.set(b,o);o+=b.length}
   await putBytes(new Blob([u]),{k:'file',sec:x.sec,fold:'',name:x.name,mime:x.mime,th:x.th})}
  await r.remove();await rtdb.ref('sb/'+id).remove();st('');$('#rc').value='';alert('Received. Saved in your vault.');
 }catch(e){st('');alert(e.message)}
}
</script></body></html>
