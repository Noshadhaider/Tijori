<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fa6450"><title>Tijori</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#fa6450;--c2:#ff8f7a;--tx:#12122b;--mu:#8e8e9a;--bd:#f1e5e2;--rd:#e5483a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#ffe3dc,#fb9a87 55%,#fa6450) fixed;color:var(--tx);font:16px/1.4 Outfit,system-ui,sans-serif}
h1{font:700 2rem/1.1 Outfit,system-ui,sans-serif;margin:0 0 6px}h3{margin:1.2rem 0 .4rem;font-size:1.05rem}
.wrap{max-width:420px;margin:0 auto;padding:12vh 20px 40px;text-align:center}
.wrap .card{background:#fff8f6;border-radius:36px;padding:34px 22px;box-shadow:0 20px 50px #fa645033}
.logo{width:74px;height:80px;margin:6px auto 12px;background:var(--c);clip-path:polygon(0 0,62% 0,100% 22%,100% 100%,0 100%);display:grid;place-items:center;font-size:2.2rem}
.mu,small{color:var(--mu)}small{display:block;font-size:.8rem}
input,textarea{width:100%;padding:14px;margin:5px 0;border-radius:16px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:999px;padding:14px 16px;background:var(--c);color:#fff;font-weight:600;width:100%;margin:5px 0;cursor:pointer}
button.g{background:#fff1ee;color:var(--c)}button.d{color:var(--rd)}button:disabled{opacity:.5}
.er{color:var(--rd);min-height:1.4em}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;box-shadow:0 0 60px #c8321f22}
main{padding:0 0 150px}.pd{padding:calc(22px + env(safe-area-inset-top,0px)) 22px 0}
.sc{display:flex;gap:14px;align-items:center;background:var(--c);color:#fff;border-radius:26px;padding:20px;margin:16px 0 6px;position:relative;overflow:hidden}
.sc::after{content:"";position:absolute;right:-40px;top:-50px;width:140px;height:140px;border-radius:50%;background:#ffffff1c}
.sc .ico{width:54px;height:54px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-size:1.6rem;flex:none}
.sc small{color:#ffffffd0}.bar{height:5px;border-radius:9px;background:#ffffff44;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .3s}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 22px 10px;color:#4b5671;font-weight:600;letter-spacing:.03em}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 22px 14px;scroll-snap-type:x mandatory}.hs::-webkit-scrollbar{display:none}
.t{flex:none;width:150px;height:150px;scroll-snap-align:start;padding:16px 14px;color:var(--tc,#fff);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,var(--a),var(--b));clip-path:polygon(0 0,62% 0,100% 22%,100% 100%,0 100%);border-radius:22px 0 22px 22px;position:relative}
.t .ic{position:absolute;left:14px;top:18px;font-size:1.9rem}.t b{font-size:1.15rem}.t small{color:inherit;opacity:.75}
.img{--a:#ff8a73;--b:#fa6450}.vid{--a:#6a6a6e;--b:#1d1d20}.file{--a:#e9e9ec;--b:#bdbdc3;--tc:#222}.note{--a:#ffb35e;--b:#f98a3c}
.r{display:flex;align-items:center;gap:14px;padding:10px 22px;cursor:pointer}.r.on{background:#fff1ee}
.fi{width:54px;height:58px;flex:none;background:var(--c) center/cover;clip-path:polygon(0 0,62% 0,100% 22%,100% 100%,0 100%);border-radius:14px 0 14px 14px;display:grid;place-items:center;font-size:1.5rem}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dots{color:#555;font-size:1.3rem;padding:0 6px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;flex:none;display:grid;place-items:center;color:#fff;font-size:.8rem}.r.on .chk{background:var(--c);border-color:var(--c)}
.bn{background:var(--c);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 22px 44px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.bn::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:#00000012}
.bn small{color:#ffffffcc}.bn h1{font-size:2.2rem;margin-top:22px}
.bb{width:42px;height:42px;padding:0;margin:0;background:#ffffff33;color:#fff}
.sheet{margin-top:-22px;background:#fff;border-radius:30px 30px 0 0;padding-top:14px;position:relative;min-height:55vh}
.row{display:flex;gap:8px;padding:0 22px}.row button{margin:5px 0}
.em{padding:20px 22px;color:var(--mu)}
.up{padding:10px 22px}.up .bar{background:#f4e6e3;margin:6px 0 2px}.up .bar i{background:var(--c)}.up.ok .bar i{background:#2fb67c}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(92vw,440px);height:64px;display:flex;align-items:center;justify-content:space-around;background:#fff;border-radius:32px;box-shadow:0 10px 34px #12122b2e;z-index:6}
nav button{background:none;color:#8a8a96;width:auto;margin:0;padding:8px 12px;font-size:1.35rem;position:relative}nav button.on{color:var(--c)}
nav .fab{width:64px;height:64px;padding:0;border-radius:50%;background:#12122b;color:#fff;font-size:2rem;margin-top:-30px;box-shadow:0 8px 20px #12122b55}
nav b{position:absolute;top:0;right:2px;background:var(--c);color:#fff;border-radius:99px;font-size:.65rem;padding:1px 6px}
#tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(86vw,400px);background:#12122b;color:#fff;border-radius:20px;padding:10px 14px;z-index:6;cursor:pointer;box-shadow:0 10px 24px #0005}
#tray .bar{margin:6px 0 0}#tray small{color:#ffffffb0}
dialog{border:0;border-radius:28px;background:#fff;color:var(--tx);width:min(92vw,440px);max-height:88vh;padding:18px}
dialog::backdrop{background:#12122b99}
#st{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#12122b;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;font-size:.9rem;max-width:90vw}
.code{font:700 2.4rem Outfit,system-ui,sans-serif;letter-spacing:.25em;text-align:center;color:var(--c);margin:14px 0}[hidden]{display:none!important}
body.dr::after{content:"Drop here to add to your vault";position:fixed;inset:12px;border:3px dashed var(--c);border-radius:30px;background:#fff9;display:grid;place-items:center;font-weight:700;color:var(--c);z-index:30}
</style></head><body>

<div id="auth" class="wrap"><div class="card">
<div class="logo">🗄️</div><h1>Tijori</h1><p class="mu">Photos, videos, files and notes in one place, open from anywhere. Log in with numbers only.</p>
<input id="id" inputmode="numeric" pattern="[0-9]*" placeholder="Vault ID (4+ digits)" autocomplete="off">
<input id="pin" inputmode="numeric" pattern="[0-9]*" type="password" placeholder="PIN (6+ digits)" autocomplete="off">
<button onclick="go('in')">Login</button><button class="g" onclick="go('new')">Create new vault</button>
<p id="er" class="er"></p></div></div>

<div id="app" hidden>
<main id="v"></main>
<div id="tray" hidden onclick="tab('u')"></div>
<nav><button id="n1" onclick="tab('v')">🗄️</button><button id="n2" onclick="tab('s')">📡</button><button class="fab" onclick="pick()">+</button><button id="n3" onclick="tab('u')">⬆️<b id="bg" hidden></b></button><button onclick="lock()">🔒</button></nav>
</div>
<div id="st" hidden></div><input type="file" id="fu" multiple hidden>
<dialog id="m"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== Fill in your Firebase config here =====
// Main project (login + vault): Auth (Email/Password) + Firestore
const CFG={apiKey:"AIzaSyBcQEV0K5zT9jticMyz92nlhjeVbbLKWBw",authDomain:"tijori-vault.firebaseapp.com",projectId:"tijori-vault",appId:"1:349470522886:web:05201754889f30724c0d87"};
// Sharing project (Realtime Database). You can use the same config + databaseURL
const SCFG={apiKey:"AIzaSyBcQEV0K5zT9jticMyz92nlhjeVbbLKWBw",authDomain:"tijori-vault.firebaseapp.com",databaseURL:"https://tijori-vault-default-rtdb.firebaseio.com",projectId:"tijori-vault",appId:"1:349470522886:web:05201754889f30724c0d87"};
// ===========================================

const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder(),m=$('#m');
const S={img:['Images','🖼️','image/*'],vid:['Videos','🎬','video/*'],file:['Files','📄','*/*'],note:['Notes','📝','']};
const MAX=25*1024*1024,CH=600*1024;
let auth,db,rtdb,KEY,UID,items=[],sel=new Set(),tb='v',nav={s:null,f:null},idle,Q=[],busy=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const err=t=>$('#er').textContent=t,st=t=>{$('#st').hidden=!t;$('#st').textContent=t};
const fs=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1e3)+' KB';
const rid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bits(p,salt){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
const aes=async(p,salt)=>crypto.subtle.importKey('raw',await bits(p,salt),'AES-GCM',false,['encrypt','decrypt']);
async function sealB(key,u){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u)),r=new Uint8Array(12+ct.length);r.set(iv);r.set(ct,12);return b64(r)}
async function unsealB(key,s){const u=unb(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}
const seal=(k,o)=>sealB(k,enc.encode(JSON.stringify(o))),unseal=async(k,s)=>JSON.parse(dec.decode(await unsealB(k,s)));
const hid=async c=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('s'+c)))].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('');
const col=n=>db.collection('users/'+UID+'/'+n);

if(CFG.apiKey&&SCFG.databaseURL){
 firebase.initializeApp(CFG);const sa=firebase.initializeApp(SCFG,'share');
 auth=firebase.auth();db=firebase.firestore();rtdb=sa.database();
 auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
}else err('First fill in the Firebase config at the top of the code.');

async function go(mode){
 if(!auth)return;
 const id=$('#id').value.trim(),pin=$('#pin').value.trim();
 if(!/^\d{4,}$/.test(id)||!/^\d{6,}$/.test(pin))return err('ID must be 4+ digits and PIN 6+ digits, numbers only.');
 document.querySelectorAll('#auth button').forEach(b=>b.disabled=true);err('');
 try{
  const em=id+'@tijori.app',pw=b64(await bits(pin,'auth'+id)).slice(0,32);
  const c=await (mode=='new'?auth.createUserWithEmailAndPassword(em,pw):auth.signInWithEmailAndPassword(em,pw));
  UID=c.user.uid;KEY=await aes(pin,'enc'+id);start();
 }catch(e){err(e.code=='auth/email-already-in-use'?'This ID already exists. Please log in.':/credential|password|user-not-found/.test(e.code)?'Wrong ID or PIN.':e.message)}
 document.querySelectorAll('#auth button').forEach(b=>b.disabled=false);
}
function start(){
 $('#auth').hidden=true;$('#app').hidden=false;render();
 col('items').orderBy('ts','desc').onSnapshot(async s=>{
  const a=await Promise.all(s.docs.map(async d=>{try{return {id:d.id,...await unseal(KEY,d.data().c)}}catch{return null}}));
  items=a.filter(Boolean);tb=='s'?shareList():render();
 });
 ['click','touchstart','keydown'].forEach(e=>addEventListener(e,()=>{clearTimeout(idle);idle=setTimeout(lock,300000)}));
}
const lock=()=>auth.signOut().then(()=>location.reload());

// ===== Files: chunked + encrypted =====
async function putBytes(u,meta,cb){
 const bid=rid(),n=Math.ceil(u.length/CH)||1;
 for(let i=0;i<n;i++){await col('blobs').doc(bid+'_'+i).set({d:await sealB(KEY,u.subarray(i*CH,(i+1)*CH))});cb&&cb((i+1)/n)}
 await col('items').add({c:await seal(KEY,{...meta,bid,n,size:u.length}),ts:Date.now()});
}
async function getBytes(x){
 const out=new Uint8Array(x.size);let o=0;
 for(let i=0;i<x.n;i++){const b=await unsealB(KEY,(await col('blobs').doc(x.bid+'_'+i).get()).data().d);out.set(b,o);o+=b.length}
 return out;
}
const race=p=>Promise.race([p,new Promise((_,j)=>setTimeout(j,5000))]);
async function thumb(f,vid){
 const u=URL.createObjectURL(f);let el,w,h;
 if(vid){el=document.createElement('video');el.muted=true;el.src=u;await race(new Promise((r,j)=>{el.onloadeddata=r;el.onerror=j}));el.currentTime=Math.min(1,(el.duration||2)/2);await race(new Promise(r=>el.onseeked=r));w=el.videoWidth;h=el.videoHeight}
 else{el=new Image;el.src=u;await race(el.decode());w=el.width;h=el.height}
 const s=Math.min(1,240/Math.max(w,h)),c=document.createElement('canvas');c.width=w*s;c.height=h*s;c.getContext('2d').drawImage(el,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.6);
}

// ===== Upload queue: everything you pick or drop collects here =====
const pick=()=>{const s=nav.s&&nav.s!='note'?nav.s:null;$('#fu').accept=s?S[s][2]:'*/*';$('#fu').click()};
function addFiles(F,sec,fold){
 for(const f of F){if(f.size>MAX){alert(f.name+' is too large (max 25MB)');continue}
  Q.push({id:rid(),f,name:f.name,size:f.size,s:sec||(f.type.startsWith('image/')?'img':f.type.startsWith('video/')?'vid':'file'),fold:fold||'',st:'wait',p:0})}
 paint();runQ();
}
async function runQ(){
 if(busy)return;busy=1;let q;
 while(q=Q.find(x=>x.st=='wait')){q.st='up';paint();
  try{let th='';try{th=q.s=='img'?await thumb(q.f):q.s=='vid'?await thumb(q.f,1):''}catch{}
   await putBytes(new Uint8Array(await q.f.arrayBuffer()),{k:'file',sec:q.s,fold:q.fold,name:q.name,mime:q.f.type||'application/octet-stream',th},p=>{q.p=p;paint()});
   q.st='done';q.p=1;q.f=null}catch(e){q.st='err';q.msg=e.message}
  paint()}
 busy=0;
}
$('#fu').onchange=e=>{const F=[...e.target.files];e.target.value='';addFiles(F,nav.s&&nav.s!='note'?nav.s:null,nav.f)};
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{if(KEY){e.preventDefault();document.body.classList.add('dr')}}));
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dr')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dr');if(KEY)addFiles([...e.dataTransfer.files],nav.s&&nav.s!='note'?nav.s:null,nav.f)});
function paint(){
 const a=Q.filter(x=>x.st=='wait'||x.st=='up'),tr=$('#tray'),bg=$('#bg');
 bg.hidden=!a.length;bg.textContent=a.length;tr.hidden=!a.length||tb=='u';
 if(a.length){const dn=Q.length-a.length,cur=Q.find(x=>x.st=='up'),pc=Math.round((dn+(cur?cur.p:0))/Q.length*100);
  tr.innerHTML=`<b>⬆️ ${dn+1}/${Q.length} uploading</b><small>${esc(cur?cur.name:'')}</small><div class="bar"><i style="width:${pc}%"></i></div>`}
 if(tb=='u')qList();
}
function qList(){
 const e=$('#ql');if(!e)return;
 e.innerHTML=Q.length?[...Q].reverse().map(q=>`<div class="up ${q.st=='done'?'ok':''}" ${q.st=='err'?`onclick="retry('${q.id}')"`:''}><div style="display:flex;justify-content:space-between;gap:10px"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.name)}</b><small>${q.st=='wait'?'Queued':q.st=='up'?Math.round(q.p*100)+'%':q.st=='done'?'✓ Done':'Failed, tap to retry'}</small></div><div class="bar"><i style="width:${Math.round(q.p*100)}%"></i></div><small>${fs(q.size)}${q.msg&&q.st=='err'?' · '+esc(q.msg):''}</small></div>`).join(''):'<p class="em">No uploads yet. Tap + below or drop files here.</p>';
}
const retry=id=>{const q=Q.find(x=>x.id==id);if(q&&q.f){q.st='wait';q.p=0;paint();runQ()}};
const clr=()=>{Q=Q.filter(x=>x.st=='wait'||x.st=='up'||x.st=='err');paint()};

// ===== Screens =====
const ico=x=>x.k=='note'?'📝':x.sec=='vid'?'🎬':x.sec=='img'?'🖼️':/pdf/.test(x.mime||'')?'📕':'📄';
const R=(x,sh)=>{
 const oc=sh?`tg('${x.id}')`:x.k=='note'?`viewNote('${x.id}')`:`viewFile('${x.id}')`;
 return `<div class="r${sh&&sel.has(x.id)?' on':''}" onclick="${oc}"><div class="fi" ${x.th?`style="background-image:url(${x.th})"`:''}>${x.th?'':ico(x)}</div><div class="rt"><b>${esc(x.k=='note'?x.title:x.name)}</b><small>${x.k=='note'?esc((x.body||'').slice(0,30)||'Note'):fs(x.size)+' · '+S[x.sec][0]}</small></div>${sh?'<span class="chk">✓</span>':'<span class="dots">⋮</span>'}</div>`};
const tile=R;
const FR=(f,s)=>`<div class="r" onclick="open2('${s}','${f.id}')"><div class="fi">📁</div><div class="rt"><b>${esc(f.name)}</b><small>${items.filter(x=>x.fold==f.id).length} files</small></div><span class="dots">⋮</span></div>`;
function tab(t){tb=t;sel.clear();if(t=='v')nav={s:null,f:null};render()}
const open2=(s,f)=>{nav={s,f:f||null};render()},up=()=>{nav.f?nav.f=null:nav.s=null;render()};
function render(){
 ['n1','n2','n3'].forEach((k,i)=>$('#'+k).classList.toggle('on',tb==['v','s','u'][i]));window.scrollTo(0,0);
 if(tb=='u'){$('#v').innerHTML=`<div class="pd"><h1>Uploads</h1><p class="mu">Every file you pick is queued up here.</p></div><div class="row"><button onclick="pick()">⬆️ Add more files</button><button class="g" style="width:auto" onclick="clr()">Clear</button></div><div id="ql"></div>`;return paint()}
 if(tb=='s'){$('#v').innerHTML=`<div class="pd"><h1>Share</h1><p class="mu">Pick files or notes, get a code and give it to the other person. End-to-end encrypted, valid for 10 minutes, one-time use. Up to 25MB total.</p></div><div id="l"></div><div class="row"><button id="sb" onclick="send()">Send (0)</button></div><div class="pd" style="padding-top:0"><h3>📥 Receive</h3><input id="rc" inputmode="numeric" placeholder="8 digit code"><button class="g" onclick="recv()">Receive</button></div>`;return shareList()}
 const s=nav.s,fo=nav.f&&items.find(x=>x.id==nav.f);
 if(!s){const used=items.reduce((a,x)=>a+(x.size||0),0),rc=items.filter(x=>x.k!='folder').slice(0,6);
  return $('#v').innerHTML=`<div class="pd"><p class="mu" style="margin:0">Welcome</p><h1>Your storage</h1><div class="sc"><div class="ico">🗄️</div><div style="flex:1"><b style="font-size:1.2rem">Used space</b><div class="bar"><i style="width:${Math.max(2,Math.min(100,used/1e7))}%"></i></div><small>${fs(used)} of 1 GB used</small></div></div></div>
  <div class="sh"><span>ALL FOLDERS</span></div><div class="hs">${Object.keys(S).map(k=>`<div class="t ${k}" onclick="open2('${k}')"><span class="ic">${S[k][1]}</span><b>${S[k][0]}</b><small>${items.filter(x=>x.sec==k&&x.k!='folder').length} items</small></div>`).join('')}</div>
  <div class="sh"><span>RECENT FILES</span></div>${rc.map(x=>R(x)).join('')||'<p class="em">Nothing here yet. Tap + below to add files.</p>'}`}
 const fl=nav.f?[]:items.filter(x=>x.sec==s&&x.k=='folder'),fi=items.filter(x=>x.sec==s&&x.k!='folder'&&(x.fold||'')==(nav.f||''));
 $('#v').innerHTML=`<div class="bn"><button class="bb" onclick="up()">←</button><h1>${fo?esc(fo.name):S[s][0]}</h1><small>${fi.length} items${fl.length?' · '+fl.length+' folders':''}</small></div>
 <div class="sheet"><div class="row">${s=='note'?`<button onclick="noteForm()">✍️ New note</button>`:`${nav.f?`<button class="g d" onclick="delFolder('${nav.f}')">🗑️ Folder</button>`:`<button class="g" onclick="mkf()">📁 Folder</button>`}<button onclick="pick()">⬆️ Upload</button>`}</div>
 ${fl.map(f=>FR(f,s)).join('')}${fi.map(x=>R(x)).join('')}${fl.length+fi.length?'':'<p class="em">Nothing here yet. Start from the buttons above.</p>'}</div>`;
}
function shareList(){
 $('#l').innerHTML=items.filter(x=>x.k!='folder').map(x=>R(x,1)).join('')||'<p class="em">Add something to the vault first.</p>';
 $('#sb').textContent='Send ('+sel.size+')';
}
const tg=id=>{sel.has(id)?sel.delete(id):sel.add(id);shareList()};
function M(h){m.innerHTML=h;if(!m.open)m.showModal()}
async function mkf(){const n=prompt('Folder name');if(n&&n.trim())await col('items').add({c:await seal(KEY,{k:'folder',sec:nav.s,name:n.trim()}),ts:Date.now()})}
async function delItem(id){const x=items.find(a=>a.id==id);if(x.k=='file')for(let i=0;i<x.n;i++)await col('blobs').doc(x.bid+'_'+i).delete();await col('items').doc(id).delete()}
async function delFolder(id){if(!confirm('This folder and all its files will be deleted. Sure?'))return;for(const x of items.filter(a=>a.fold==id))await delItem(x.id);await delItem(id);nav.f=null;render()}
async function del(id){if(confirm('Delete this permanently?')){await delItem(id);m.close()}}

async function viewFile(id){
 const x=items.find(a=>a.id==id);
 M(`<h3 style="margin-top:0">${esc(x.name)}</h3><p class="mu" id="ld">Opening…</p><div id="pv"></div><div class="row"><button class="g" onclick="pushShare([items.find(a=>a.id=='${id}')])">Share</button><button class="g d" onclick="del('${id}')">Delete</button></div><button class="g" onclick="m.close()">Close</button>`);
 try{const u=URL.createObjectURL(new Blob([await getBytes(x)],{type:x.mime}));$('#ld').remove();
  $('#pv').innerHTML=(x.mime.startsWith('image/')?`<img src="${u}" style="width:100%;border-radius:12px">`:x.mime.startsWith('video/')?`<video src="${u}" controls playsinline style="width:100%;border-radius:12px"></video>`:'')+`<a download="${esc(x.name)}" href="${u}"><button>⬇️ Download</button></a>`;
 }catch(e){$('#ld')&&($('#ld').textContent=e.message)}
}

  id?await col('items').doc(id).update({c}):await col('items').add({c,ts:Date.now()});m.close()}catch(e){alert(e.message)}

// ===== Code-based sharing, end-to-end encrypted =====
function send(){
 const L=items.filter(i=>sel.has(i.id));if(!L.length)return alert('Select items first');
 if(L.reduce((a,x)=>a+(x.size||0),0)>MAX)return alert('You cannot send more than 25MB in total');pushShare(L);
}
async function pushShare(L){
 try{
  const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1e8).padStart(8,'0'),id=await hid(code),k=await aes(code,'share'),metas=[];
  for(let j=0;j<L.length;j++){const {id:_,...x}=L[j];st(`Sending ${j+1}/${L.length}…`);
   if(x.k=='file'){const u=await getBytes(x);for(let i=0;i<x.n;i++)await rtdb.ref('sb/'+id+'/'+x.bid+'_'+i).set(await sealB(k,u.subarray(i*CH,(i+1)*CH)));x.fold=''}
   metas.push(x)}
  await rtdb.ref('s/'+id).set({c:await seal(k,metas),exp:Date.now()+6e5});st('');
  M(`<h3 style="margin-top:0">Share code</h3><div class="code">${code}</div><p class="mu">Give this code to the other person. It works for 10 minutes and expires as soon as it is received once.</p><button onclick="m.close()">OK</button>`);
 }catch(e){st('');alert(e.message)}
}
async function recv(){
 const c=$('#rc').value.trim();if(!/^\d{8}$/.test(c))return alert('Enter the 8-digit code');
 try{
  const id=await hid(c),r=rtdb.ref('s/'+id),s=await r.get();
  if(!s.exists()||s.val().exp<Date.now())return alert('Code is wrong or has expired');
  const k=await aes(c,'share'),L=await unseal(k,s.val().c);
  for(let j=0;j<L.length;j++){const x=L[j];st(`Receive ${j+1}/${L.length}…`);
   if(x.k=='note'){await col('items').add({c:await seal(KEY,x),ts:Date.now()});continue}
   const u=new Uint8Array(x.size);let o=0;
   for(let i=0;i<x.n;i++){const b=await unsealB(k,(await rtdb.ref('sb/'+id+'/'+x.bid+'_'+i).get()).val());u.set(b,o);o+=b.length}
   await putBytes(u,{k:'file',sec:x.sec,fold:'',name:x.name,mime:x.mime,th:x.th})}
  await r.remove();await rtdb.ref('sb/'+id).remove();st('');$('#rc').value='';alert('Received. Saved in your vault.');
 }catch(e){st('');alert(e.message)}
}
