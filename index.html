</style></head><body>

<div id="auth" class="wrap"><div class="card">
<div class="logo">🗄️</div><h1>Tijori</h1><p class="mu">Photos, videos, files and notes in one place, stored securely on Firebase. Log in with numbers only.</p>
<input id="id" inputmode="numeric" pattern="[0-9]*" placeholder="Vault ID (4+ digits)" autocomplete="off">
<input id="pin" inputmode="numeric" pattern="[0-9]*" type="password" placeholder="PIN (6+ digits)" autocomplete="off">
<button onclick="go('in')">Login</button><button class="g" onclick="go('new')">Create new vault</button>
<p id="er" class="er"></p></div></div>

<div id="app" hidden>
<main id="v"></main>
<div id="tray" hidden onclick="tab('u')"></div><div id="ab" hidden></div>
<nav><button id="n1" onclick="tab('v')">🗄️</button><button id="n2" onclick="tab('s')">📡</button><button class="fab" onclick="pick()">+</button><button id="n3" onclick="tab('u')">⬆️<b id="bg" hidden></b></button><button onclick="askLock()">🔒</button></nav>
</div>
<div id="st" hidden></div><input type="file" id="fu" multiple hidden>
<dialog id="m"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== Fill in your Firebase config here =====
// Free Spark plan: Auth (Email/Password) + Firestore (metadata AND encrypted file chunks) + Realtime Database (share codes). No Storage needed.
const CFG={apiKey:"AIzaSyCCluCz2Q7NIBQ_ilD1guetBXzphqopYjo",authDomain:"tijori-6fe1f.firebaseapp.com",projectId:"tijori-6fe1f",storageBucket:"tijori-6fe1f.firebasestorage.app",messagingSenderId:"1064763674054",appId:"1:1064763674054:web:86427b660a4ad0a743b6c7"};
// Sharing (Realtime Database): same project, plus databaseURL
const SCFG={...CFG,databaseURL:"https://tijori-6fe1f-default-rtdb.asia-southeast1.firebasedatabase.app"};

const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder(),m=$('#m');
const S={img:['Photos','🖼️','image/*','#f6c84c','#fff3cf'],vid:['Videos','🎬','video/*','#5b7cff','#e3ecff'],file:['Files','📄','*/*','#35b479','#d9f2e3'],note:['Notes','📝','','#ff6f91','#ffe3ea']};
const MAX=1024*1024*1024;      // vault quota: Firestore free tier is about 1 GB total
const SHAREMAX=25*1024*1024;      // quick-share codes still go through Firebase RTDB, kept small
const CH=900*1024;             // plaintext chunk size; each sealed chunk must stay under the 1 MiB Firestore document limit
let auth,db,rtdb,KEY,UID,items=[],sel=new Set(),tb='v',nav={s:null,f:null},idle,Q=[],busy=0,selMode=0,CB=null,qs='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const err=t=>$('#er').textContent=t,st=t=>{$('#st').hidden=!t;$('#st').textContent=t};
const fs=n=>n>1e9?(n/1e9).toFixed(2)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1e3)+' KB';
const rid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bits(p,salt){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
const aes=async(p,salt)=>crypto.subtle.importKey('raw',await bits(p,salt),'AES-GCM',false,['encrypt','decrypt']);
async function sealB(key,u){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u)),r=new Uint8Array(12+ct.length);r.set(iv);r.set(ct,12);return b64(r)}
async function unsealB(key,s){const u=unb(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}
const seal=(k,o)=>sealB(k,enc.encode(JSON.stringify(o))),unseal=async(k,s)=>JSON.parse(dec.decode(await unsealB(k,s)));
const hid=async c=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('s'+c)))].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('');
const col=n=>db.collection('users/'+UID+'/'+n);

// ---- raw-byte AES-GCM (no base64) used for the R2 upload/download path, so a 10GB file
// never has its size inflated by ~33% and isn't round-tripped through a text string ----
async function sealRaw(key,u){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u)),r=new Uint8Array(12+ct.length);r.set(iv);r.set(ct,12);return r}
async function unsealRaw(key,u){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}

if(CFG.apiKey&&SCFG.databaseURL){
 firebase.initializeApp(CFG);const sa=firebase.initializeApp(SCFG,'share');
 auth=firebase.auth();db=firebase.firestore();rtdb=sa.database();
 auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
}else err('First fill in the Firebase config at the top of the code.');

async function go(mode){
 if(!auth)return;
 const id=$('#id').value.trim(),pin=$('#pin').value.trim();
 if(!/^\d{4,}$/.test(id)||!/^\d{6,}$/.test(pin))return err('ID must be 4+ digits and PIN 6+ digits, numbers only.');
 document.querySelectorAll('#auth button').forEach(b=>b.disabled=true);err('');
 try{
  const em=id+'@tijori.app',pw=b64(await bits(pin,'auth'+id)).slice(0,32);
  const c=await (mode=='new'?auth.createUserWithEmailAndPassword(em,pw):auth.signInWithEmailAndPassword(em,pw));
  UID=c.user.uid;KEY=await aes(pin,'enc'+id);start();
 }catch(e){err(e.code=='auth/email-already-in-use'?'This ID already exists. Please log in.':/credential|password|user-not-found/.test(e.code)?'Wrong ID or PIN.':e.message)}
 document.querySelectorAll('#auth button').forEach(b=>b.disabled=false);
}
function start(){
 $('#auth').hidden=true;$('#app').hidden=false;render();
 col('items').orderBy('ts','desc').onSnapshot(async s=>{
  const a=await Promise.all(s.docs.map(async d=>{try{return {id:d.id,...await unseal(KEY,d.data().c)}}catch{return null}}));
  items=a.filter(Boolean);tb=='s'?shareList():render();
 });
 ['click','touchstart','keydown'].forEach(e=>addEventListener(e,()=>{clearTimeout(idle);idle=setTimeout(lock,300000)}));
}
const lock=()=>auth.signOut().then(()=>location.reload());
const askLock=()=>{if(confirm('Log out of your vault?'))lock()};

// ===== Files: encrypted in the browser, stored as ~900 KB chunks in Firestore (users/<uid>/blobs) - works on the free Spark plan =====
const BL=(bid,i)=>col('blobs').doc(bid+'_'+i);
async function putBytes(file,meta,cb){
 const bid=rid(),n=Math.ceil(file.size/CH)||1;let done=0;
 try{
  for(let i=0;i<n;i++){
   const chunk=new Uint8Array(await file.slice(i*CH,Math.min(file.size,(i+1)*CH)).arrayBuffer());
   const sealed=await sealRaw(KEY,chunk);
   await BL(bid,i).set({d:firebase.firestore.Blob.fromUint8Array(sealed)});done=i+1;
   cb&&cb(done/n);
  }
 }catch(e){await deleteBlob(bid,done+1).catch(()=>{});throw e}
 await col('items').add({c:await seal(KEY,{...meta,bid,n,size:file.size}),ts:Date.now()});
}
async function getBytes(x){
 // Note: this buffers the whole decrypted file in memory before returning it.
 const out=new Uint8Array(x.size);let o=0;
 for(let i=0;i<x.n;i++){
  const d=await BL(x.bid,i).get();if(!d.exists)throw new Error('File data missing');
  out.set(await unsealRaw(KEY,d.data().d.toUint8Array()),o);o+=Math.min(CH,x.size-i*CH);
 }
 return out;
}
async function deleteBlob(bid,n){for(let i=0;i<n;i++)await BL(bid,i).delete()}

const race=p=>Promise.race([p,new Promise((_,j)=>setTimeout(j,5000))]);
async function thumb(f,vid){
 const u=URL.createObjectURL(f);let el,w,h;
 if(vid){el=document.createElement('video');el.muted=true;el.src=u;await race(new Promise((r,j)=>{el.onloadeddata=r;el.onerror=j}));el.currentTime=Math.min(1,(el.duration||2)/2);await race(new Promise(r=>el.onseeked=r));w=el.videoWidth;h=el.videoHeight}
 else{el=new Image;el.src=u;await race(el.decode());w=el.width;h=el.height}
 const s=Math.min(1,240/Math.max(w,h)),c=document.createElement('canvas');c.width=w*s;c.height=h*s;c.getContext('2d').drawImage(el,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.6);
}

// ===== Upload queue: everything you pick or drop collects here =====
const usedBytes=()=>items.reduce((a,x)=>a+(x.size||0),0);
const cs=()=>nav.s&&nav.s!='note'&&nav.s!='all'?nav.s:null;
const pick=()=>{const s=cs();$('#fu').accept=s?S[s][2]:'*/*';$('#fu').click()};
function addFiles(F,sec,fold){
 let queued=Q.filter(x=>x.st=='wait'||x.st=='up').reduce((a,x)=>a+x.size,0);
 for(const f of F){
  if(usedBytes()+queued+f.size>MAX){alert(f.name+' would go over your '+fs(MAX)+' vault quota.');continue}
  queued+=f.size;
  Q.push({id:rid(),f,name:f.name,size:f.size,s:sec||(f.type.startsWith('image/')?'img':f.type.startsWith('video/')?'vid':'file'),fold:fold||'',st:'wait',p:0})}
 paint();runQ();
}
async function runQ(){
 if(busy)return;busy=1;let q;
 while(q=Q.find(x=>x.st=='wait')){q.st='up';paint();
  try{let th='';try{th=q.s=='img'?await thumb(q.f):q.s=='vid'?await thumb(q.f,1):''}catch{}
   await putBytes(q.f,{k:'file',sec:q.s,fold:q.fold,name:q.name,mime:q.f.type||'application/octet-stream',th},p=>{q.p=p;paint()});
   q.st='done';q.p=1;q.f=null}catch(e){q.st='err';q.msg=e.message}
  paint()}
 busy=0;
}
$('#fu').onchange=e=>{const F=[...e.target.files];e.target.value='';addFiles(F,cs(),nav.f)};
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{if(KEY){e.preventDefault();document.body.classList.add('dr')}}));
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dr')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dr');if(KEY)addFiles([...e.dataTransfer.files],cs(),nav.f)});
function paint(){
 const a=Q.filter(x=>x.st=='wait'||x.st=='up'),tr=$('#tray'),bg=$('#bg');
 bg.hidden=!a.length;bg.textContent=a.length;tr.hidden=!a.length||tb=='u';
 if(a.length){const dn=Q.length-a.length,cur=Q.find(x=>x.st=='up'),pc=Math.round((dn+(cur?cur.p:0))/Q.length*100);
  tr.innerHTML=`<b>⬆️ ${dn+1}/${Q.length} uploading</b><small>${esc(cur?cur.name:'')}</small><div class="bar"><i style="width:${pc}%"></i></div>`}
 if(tb=='u')qList();
}
function qList(){
 const e=$('#ql');if(!e)return;
 e.innerHTML=Q.length?[...Q].reverse().map(q=>`<div class="up ${q.st=='done'?'ok':''}" ${q.st=='err'?`onclick="retry('${q.id}')"`:''}><div style="display:flex;justify-content:space-between;gap:10px"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.name)}</b><small>${q.st=='wait'?'Queued':q.st=='up'?Math.round(q.p*100)+'%':q.st=='done'?'✓ Done':'Failed, tap to retry'}</small></div><div class="bar"><i style="width:${Math.round(q.p*100)}%"></i></div><small>${fs(q.size)}${q.msg&&q.st=='err'?' · '+esc(q.msg):''}</small></div>`).join(''):'<p class="em">No uploads yet. Tap + below or drop files here.</p>';
}
const retry=id=>{const q=Q.find(x=>x.id==id);if(q&&q.f){q.st='wait';q.p=0;paint();runQ()}};
const clr=()=>{Q=Q.filter(x=>x.st=='wait'||x.st=='up'||x.st=='err');paint()};

// ===== Screens =====
const ico=x=>x.k=='note'?'📝':x.sec=='vid'?'🎬':x.sec=='img'?'🖼️':/pdf/.test(x.mime||'')?'📕':'📄';
const R=(x,sh)=>{
 const oc=sh?`tg('${x.id}')`:x.k=='note'?`viewNote('${x.id}')`:`viewFile('${x.id}')`;
 return `<div class="r${sh&&sel.has(x.id)?' on':''}" onclick="${oc}"><div class="fi" style="${x.th?`background-image:url(${x.th});background-size:cover`:`background:${S[x.sec][3]}`}">${x.th?'':ico(x)}</div><div class="rt"><b>${esc(x.k=='note'?x.title:x.name)}</b><small>${x.k=='note'?esc((x.body||'').slice(0,30)||'Note'):fs(x.size)+' · '+S[x.sec][0]}</small></div>${sh?'<span class="chk">✓</span>':`<span class="dots" onclick="event.stopPropagation();rowMenu('${x.id}')">⋮</span>`}</div>`};
const FR=(f)=>`<div class="fgc" onclick="open2('${f.sec}','${f.id}')"><span class="dots" onclick="event.stopPropagation();delFolder('${f.id}')">⋮</span><div class="ic2" style="background:${S[f.sec][4]}">${S[f.sec][1]}</div><b>${esc(f.name)}</b><small>${items.filter(x=>x.fold==f.id).length} Files, ${fs(items.filter(x=>x.fold==f.id).reduce((a,x)=>a+(x.size||0),0))}</small></div>`;
function tab(t){tb=t;sel.clear();selMode=0;qs='';if(t=='v')nav={s:null,f:null};render()}
const open2=(s,f)=>{nav={s,f:f||null,q:'all'};sel.clear();selMode=0;qs='';render()},up=()=>{nav.f?nav.f=null:nav.s=null;sel.clear();selMode=0;qs='';render()};
const q=()=>qs.trim().toLowerCase();
const mt=x=>!q()||(x.k=='note'?(x.title||'')+' '+(x.body||''):x.name||'').toLowerCase().includes(q());
const srch=id=>`<input class="si" placeholder="🔍 Search" value="${esc(qs)}" oninput="qs=this.value;$('#${id}').innerHTML=${id=='hm'?'homeBody()':'secBody()'}">`;
const homeBody=()=>{
 if(q()){const r=items.filter(x=>x.k=='folder'?x.name.toLowerCase().includes(q()):mt(x));return `<div class="sh"><span>RESULTS (${r.length})</span></div>`+(r.map(x=>x.k=='folder'?R(x):R(x)).join('')||'<p class="em">No matches found.</p>')}
 const used=usedBytes(),cats=Object.keys(S).filter(k=>k!='note').concat(['note']);
 const grid=cats.map(k=>`<div class="gi" onclick="open2('${k}')"><div class="ic" style="background:${S[k][4]}">${S[k][1]}</div><div><b>${S[k][0]}</b><small>${Math.min(100,Math.round(items.filter(x=>x.sec==k&&x.k!='folder').reduce((a,x)=>a+(x.size||0),0)/MAX*100))}%</small></div></div>`).join('');
 const segs=Object.keys(S).map(k=>({k,b:items.filter(x=>x.sec==k&&x.k!='folder').reduce((a,x)=>a+(x.size||0),0)}));
 let acc=0,stops=segs.map(s=>{const p0=acc/MAX*100;acc+=s.b;return `${S[s.k][3]} ${p0}% ${acc/MAX*100}%`}).join(',');
 const pct=Math.min(100,Math.round(acc/MAX*100));
 const donut=`<div class="donut" style="background:conic-gradient(${stops},#e4e8ff ${pct}% 100%)"><b>${pct}%</b></div><p class="mu" style="margin:0">${fs(used)} of ${fs(MAX)} used</p>`;
 const rc=items.filter(x=>x.k!='folder').slice(0,6);
 return `<div class="gc">${grid}</div><div class="mem"><div class="hd"><div class="ic">💽</div><b>Memory status</b><div class="arrow">↗</div></div>${donut}</div>
  <div class="sh"><span>RECENT FILES</span></div>${rc.map(x=>R(x)).join('')||'<p class="em">Nothing here yet. Tap + below to add files.</p>'}`};
const fls=()=>nav.f?[]:items.filter(x=>x.k=='folder'&&(nav.s=='all'?(nav.q||'all')=='all':x.sec==nav.s)&&(!q()||x.name.toLowerCase().includes(q())));
const secBody=()=>{const fl=fls(),fi=vis();
 return (fl.length?`<div class="fg">${fl.map(f=>FR(f)).join('')}</div>`:'')+fi.map(x=>R(x,selMode)).join('')+(fl.length+fi.length?'':`<p class="em">${q()?'No matches found.':'Nothing here yet. Start from the buttons above.'}</p>`)};
function render(){
 ['n1','n2','n3'].forEach((k,i)=>$('#'+k).classList.toggle('on',tb==['v','s','u'][i]));window.scrollTo(0,0);bar();
 if(tb=='u'){$('#v').innerHTML=`<div class="pd"><h1>Uploads</h1><p class="mu">Every file you pick is queued up here, then encrypted and stored in your Firebase database.</p></div><div class="row" style="padding:0 22px"><button onclick="pick()">⬆️ Add more files</button><button class="g" style="width:auto" onclick="clr()">Clear</button></div><div id="ql" style="padding:0 22px"></div>`;return paint()}
 if(tb=='s'){$('#v').innerHTML=`<div class="pd"><h1>Share</h1><p class="mu">Pick files or notes, get a code and give it to the other person. End-to-end encrypted, valid for 10 minutes, one-time use, up to ${fs(SHAREMAX)} total.</p></div><div id="l" style="padding:0 22px"></div><div class="row" style="padding:0 22px"><button id="sb" onclick="send()">Send (0)</button></div><div class="pd" style="padding-top:0"><h3>📥 Receive</h3><input id="rc" inputmode="numeric" placeholder="8 digit code"><button class="g" onclick="recv()">Receive</button></div>`;return shareList()}
 const s=nav.s,fo=nav.f&&items.find(x=>x.id==nav.f);
 if(!s){return $('#v').innerHTML=`<div class="pd"><p class="mu" style="margin:0">Welcome</p><h1>My storage</h1>${srch('hm')}<div id="hm" style="margin-top:16px">${homeBody()}</div></div>`}
 const fl=fls(),fi=vis();
 $('#v').innerHTML=`<div class="bn"><button class="bb" onclick="up()">←</button><h1>${fo?esc(fo.name):s=='all'?'All folders':S[s][0]}</h1><small>${fi.length} items${fl.length?' · '+fl.length+' folders':''}</small></div>
 <div class="sheet"><div class="row">${selMode?`<button onclick="selAll()">Select all</button><button class="g" style="width:auto" onclick="selTog()">Cancel</button>`:s=='note'?`<button onclick="noteForm()">✍️ New note</button>`:`${nav.f?`<button class="g d" onclick="delFolder('${nav.f}')">🗑️ Folder</button>`:`<button class="g" onclick="mkf()">📁 Folder</button>`}<button onclick="pick()">⬆️ Upload</button>`}${selMode||CB?'':'<button class="g" style="width:auto" onclick="selTog()">☑️</button>'}</div>
 <div style="margin:10px 0">${srch('sl')}</div>${s=='all'?`<div class="hs">${CHIPS.map(([k,l])=>`<button class="ch${(nav.q||'all')==k?' on':''}" onclick="setQ('${k}')">${l} ${items.filter(x=>x.k!='folder'&&cat(x,k)).length}</button>`).join('')}</div>`:''}<div id="sl">${secBody()}</div></div>`;
}
function shareList(){
 $('#l').innerHTML=items.filter(x=>x.k!='folder').map(x=>R(x,1)).join('')||'<p class="em">Add something to the vault first.</p>';
 $('#sb').textContent='Send ('+sel.size+')';
}
const tg=id=>{sel.has(id)?sel.delete(id):sel.add(id);tb=='s'?shareList():keep()};
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
const isDoc=x=>x.k=='file'&&(/pdf|word|officedocument|msword|excel|powerpoint|opendocument|rtf|text\//.test(x.mime||'')||/\.(pdf|docx?|xlsx?|pptx?|txt|csv|rtf|odt|ods|odp)$/i.test(x.name||''));
const cat=(x,q)=>q=='all'||(q=='img'?x.sec=='img':q=='vid'?x.sec=='vid':q=='note'?x.k=='note':q=='doc'?isDoc(x):x.k=='file'&&x.sec=='file'&&!isDoc(x));
const CHIPS=[['all','All'],['img','🖼️ Photos'],['vid','🎬 Videos'],['doc','📕 Documents'],['file','📄 Files'],['note','📝 Notes']];
const setQ=k=>{nav.q=k;sel.clear();render()};
const vis=()=>(nav.s=='all'?items.filter(x=>x.k!='folder'&&cat(x,nav.q||'all')):items.filter(x=>x.sec==nav.s&&x.k!='folder'&&(x.fold||'')==(nav.f||''))).filter(mt);
const selTog=()=>{selMode=!selMode;sel.clear();keep()};
const selAll=()=>{const v=vis();v.every(x=>sel.has(x.id))?sel.clear():v.forEach(x=>sel.add(x.id));keep()};
const clip=cut=>{CB={cut,ids:[...sel]};sel.clear();selMode=0;keep()};
function bar(){
 const e=$('#ab');if(tb!='v'||!nav.s)return e.hidden=true;
 if(CB){e.hidden=false;e.innerHTML=`<span><b>${CB.ids.length}</b> ${CB.cut?'cut':'copied'}${nav.s=='all'?' · open a folder to paste':''}</span><span>${nav.s=='all'?'':'<button onclick="paste()">📥 Paste here</button>'}<button class="g" onclick="CB=null;keep()">✕</button></span>`;return}
 if(selMode){const d=sel.size?'':'disabled';e.hidden=false;e.innerHTML=`<span><b>${sel.size}</b> selected</span><span><button onclick="clip(1)" ${d}>✂️ Cut</button><button class="g" onclick="clip(0)" ${d}>📋 Copy</button><button class="g d" onclick="delSel()" ${d}>🗑️</button></span>`;return}
 e.hidden=true;
}
async function paste(){
 const C=CB,L=C.ids.map(id=>items.find(x=>x.id==id)).filter(Boolean),s=nav.s,f=nav.f||'';let skip=0;CB=null;
 try{for(let j=0;j<L.length;j++){const {id,...x}=L[j];
   if((x.k=='note')!=(s=='note')){skip++;continue}
   st(`${C.cut?'Moving':'Copying'} ${j+1}/${L.length}…`);
   const nx={...x,sec:s,fold:f};
   if(C.cut)await col('items').doc(id).update({c:await seal(KEY,nx)});
   else if(x.k=='note')await col('items').add({c:await seal(KEY,nx),ts:Date.now()});
   else{const {bid,n,size,...meta}=nx;const bytes=await getBytes(x);await putBytes(new Blob([bytes]),meta)}
  }}catch(e){alert(e.message)}
 st('');if(skip)alert(skip+' item(s) skipped: notes and files cannot be mixed.');render();
}
function M(h){m.innerHTML=h;if(!m.open)m.showModal()}
async function mkf(){
 if(nav.s=='all')return M(`<h3 style="margin-top:0">New folder</h3><input id="fn" placeholder="Folder name"><p class="mu">Create it in:</p>${Object.keys(S).map(k=>`<button class="g" onclick="mkf2('${k}')">${S[k][1]} ${S[k][0]}</button>`).join('')}<button class="g" onclick="m.close()">Cancel</button>`);
 const n=prompt('Folder name');if(n&&n.trim())await col('items').add({c:await seal(KEY,{k:'folder',sec:nav.s,name:n.trim()}),ts:Date.now()})
}
async function mkf2(sec){const n=$('#fn').value.trim();if(!n)return alert('Enter a folder name');try{await col('items').add({c:await seal(KEY,{k:'folder',sec,name:n}),ts:Date.now()});m.close()}catch(e){alert(e.message)}}
function rowMenu(id){
 const x=items.find(a=>a.id==id);if(!x)return;
 M(`<h3 style="margin-top:0">${esc(x.k=='note'?x.title:x.name)}</h3><button onclick="${x.k=='note'?'viewNote':'viewFile'}('${id}')">Open</button><button class="g" onclick="m.close();pushShare([items.find(a=>a.id=='${id}')])">Share</button><button class="g d" onclick="del('${id}')">Delete</button><button class="g" onclick="m.close()">Close</button>`);
}
async function delSel(){
 const n=sel.size;if(!n||!confirm(`Delete ${n} item${n>1?'s':''} permanently?`))return;
 const L=[...sel];sel.clear();selMode=0;
 try{for(let j=0;j<L.length;j++){st(`Deleting ${j+1}/${L.length}…`);if(items.find(a=>a.id==L[j]))await delItem(L[j])}}catch(e){alert(e.message)}
 st('');render();
}
async function delItem(id){const x=items.find(a=>a.id==id);if(x.k=='file')await deleteBlob(x.bid,x.n);await col('items').doc(id).delete()}
async function delFolder(id){if(!confirm('This folder and all its files will be deleted. Sure?'))return;for(const x of items.filter(a=>a.fold==id))await delItem(x.id);await delItem(id);nav.f=null;render()}
async function del(id){if(confirm('Delete this permanently?')){await delItem(id);m.close()}}

async function viewFile(id){
 const x=items.find(a=>a.id==id);
 M(`<h3 style="margin-top:0">${esc(x.name)}</h3><p class="mu" id="ld">Opening…</p><div id="pv"></div><div class="row"><button class="g" onclick="pushShare([items.find(a=>a.id=='${id}')])">Share</button><button class="g d" onclick="del('${id}')">Delete</button></div><button class="g" onclick="m.close()">Close</button>`);
 try{const u=URL.createObjectURL(new Blob([await getBytes(x)],{type:x.mime}));$('#ld').remove();
  $('#pv').innerHTML=(x.mime.startsWith('image/')?`<img src="${u}" style="width:100%;border-radius:12px">`:x.mime.startsWith('video/')?`<video src="${u}" controls playsinline style="width:100%;border-radius:12px"></video>`:'')+`<a download="${esc(x.name)}" href="${u}"><button>⬇️ Download</button></a>`;
 }catch(e){$('#ld')&&($('#ld').textContent=e.message)}
}
function viewNote(id){
 const x=items.find(a=>a.id==id);
 M(`<h3 style="margin-top:0">📝 ${esc(x.title)}</h3><p style="white-space:pre-wrap;word-break:break-word">${esc(x.body)}</p><div class="row"><button class="g" onclick="noteForm('${id}')">Edit</button><button class="g" onclick="pushShare([items.find(a=>a.id=='${id}')])">Share</button><button class="g d" onclick="del('${id}')">Delete</button></div><button class="g" onclick="m.close()">Close</button>`);
}
function noteForm(id){
 const x=id?items.find(a=>a.id==id):{title:'',body:''};
 M(`<h3 style="margin-top:0">${id?'Edit note':'New note'}</h3><input id="nt" placeholder="Title" value="${esc(x.title)}"><textarea id="nb" rows="10" placeholder="Write here…">${esc(x.body)}</textarea><button onclick="saveNote('${id||''}')">Save</button><button class="g" onclick="m.close()">Cancel</button>`);
}
async function saveNote(id){
 try{const c=await seal(KEY,{k:'note',sec:'note',title:$('#nt').value.trim()||'Untitled',body:$('#nb').value});
  id?await col('items').doc(id).update({c}):await col('items').add({c,ts:Date.now()});m.close()}catch(e){alert(e.message)}
}

// ===== Code-based sharing (small files), end-to-end encrypted, via Firebase RTDB =====
function send(){
 const L=items.filter(i=>sel.has(i.id));if(!L.length)return alert('Select items first');
 if(L.reduce((a,x)=>a+(x.size||0),0)>SHAREMAX)return alert('You cannot send more than '+fs(SHAREMAX)+' in total');pushShare(L);
}
async function pushShare(L){
 try{
  const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1e8).padStart(8,'0'),id=await hid(code),k=await aes(code,'share'),metas=[];
  for(let j=0;j<L.length;j++){const {id:_,...x}=L[j];st(`Sending ${j+1}/${L.length}…`);
   if(x.k=='file'){const u=await getBytes(x);const sch=600*1024,sn=Math.ceil(u.length/sch)||1;for(let i=0;i<sn;i++)await rtdb.ref('sb/'+id+'/'+(x.bid||'f')+'_'+i).set(await sealB(k,u.subarray(i*sch,(i+1)*sch)));x.sn=sn;x.fold=''}
   metas.push(x)}
  await rtdb.ref('s/'+id).set({c:await seal(k,metas),exp:Date.now()+6e5});st('');
  M(`<h3 style="margin-top:0">Share code</h3><div class="code">${code}</div><p class="mu">Give this code to the other person. It works for 10 minutes and expires as soon as it is received once.</p><button onclick="m.close()">OK</button>`);
 }catch(e){st('');alert(e.message)}
}
async function recv(){
 const c=$('#rc').value.trim();if(!/^\d{8}$/.test(c))return alert('Enter the 8-digit code');
 try{
  const id=await hid(c),r=rtdb.ref('s/'+id),s=await r.get();
  if(!s.exists()||s.val().exp<Date.now())return alert('Code is wrong or has expired');
  const k=await aes(c,'share'),L=await unseal(k,s.val().c);
  for(let j=0;j<L.length;j++){const x=L[j];st(`Receive ${j+1}/${L.length}…`);
   if(x.k=='note'){await col('items').add({c:await seal(KEY,x),ts:Date.now()});continue}
   const u=new Uint8Array(x.size);let o=0;
   for(let i=0;i<x.sn;i++){const b=await unsealB(k,(await rtdb.ref('sb/'+id+'/'+(x.bid||'f')+'_'+i).get()).val());u.set(b,o);o+=b.length}
   await putBytes(new Blob([u]),{k:'file',sec:x.sec,fold:'',name:x.name,mime:x.mime,th:x.th})}
  await r.remove();await rtdb.ref('sb/'+id).remove();st('');$('#rc').value='';alert('Received. Saved in your vault.');
 }catch(e){st('');alert(e.message)}
}
</script></body></html>
